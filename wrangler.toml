name = "book2film-studio-canary"
main = "worker/index.js"
compatibility_date = "2026-08-27"
# Staging-only, matching conseiv.com's 2026-09-14 precedent: real workers_dev
# subdomain for live verification, no production route on book2film.cc yet -
# that's a deliberate, separate decision (see ventures.json evidence), not
# an oversight. CANARY_ENABLED stays false for the same reason.
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
CANARY_ENABLED = "false"
CANARY_ALLOWED_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "book2film-studio"
# Provisioned 2026-09-14 (depth-build pass) via `wrangler d1 create` in the
# real johnmobley99 Cloudflare account. Not yet in production traffic - see
# workers_dev above, used only for staging live-verification.
database_id = "b07cf80d-26b2-4b6e-835c-66755617a8ee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MANUSCRIPTS"
bucket_name = "book2film-private-manuscripts"

[[services]]
binding = "OCR_SERVICE"
service = "weyland-ocr-worker"
[[services]]
binding = "LLM_CORTEX"
service = "book2film-qwen-bridge"
[[services]]
binding = "FILMLINE_VIDEO"
service = "filmline-video-worker"
